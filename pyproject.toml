[project]
name = "orchestra-opportunity-agent"
version = "0.1.0"
description = "Agent sledující konkurzy do orchestrů, vyhodnocující je přes Gemini Flash a posílající notifikace."
authors = [
    { name = "Přemysl Holásek" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "google-genai (>=1.0.0,<3.0.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=5.0,<7.0)",
    "sqlalchemy (>=2.0,<3.0)",
    "pydantic (>=2.0,<3.0)",
    "pydantic-settings (>=2.0,<3.0)",
    "python-dotenv (>=1.0,<2.0)",
    "requests (>=2.31,<3.0)",
    "groq (>=1.6.0,<2.0.0)",
    "fastapi (>=0.115,<1.0)",
    "strawberry-graphql[fastapi] (>=0.250,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "mcp (>=1.12.4,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
httpx = ">=0.27,<1.0"
ruff = ">=0.6"
mypy = ">=1.11"
poethepoet = ">=0.27"

[tool.poe.tasks]
lint = "ruff check ."
typecheck = "mypy app config.py main.py"
test = "pytest"
check = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
